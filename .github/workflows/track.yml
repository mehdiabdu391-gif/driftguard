name: Track provider specs
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: track
  cancel-in-progress: false
env:
  OASDIFF_VERSION: '1.34.0'
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Tracker output lives on the `data` branch as one commit that each run replaces,
      # so neither branch accumulates data history.
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Install oasdiff
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin oasdiff
          oasdiff --version
      - name: Snapshot and diff specs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/drift.js track
      - name: Rebuild SDK maps (Mondays and manual runs)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then node bin/drift.js sdk-maps; fi
      - name: Publish data branch
        working-directory: data
        run: |
          git config user.name "driftguard-bot"
          git config user.email "driftguard-bot@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "data: spec snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin publish:data
      - name: Build Pages site
        run: node bin/drift.js site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
